services:
  quant-ux-frontend:
    image: quant-ux-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        QUX_HTTP_PORT: ${QUX_HTTP_PORT:-8082}
    container_name: quant-ux-frontend
    env_file:
      - .env
    environment:
      QUX_HTTP_PORT: ${QUX_HTTP_PORT:-8082}
      CHOKIDAR_USEPOLLING: "true"
      HOST: 0.0.0.0
    ports:
      - "${QUX_HTTP_PORT:-8082}:${QUX_HTTP_PORT:-8082}"
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./
          target: /home/node
          ignore:
            - node_modules/
            - dist/
            - .env
            - .env.local
            - .env.development.local
            - .env.test.local
            - .git/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json
        - action: rebuild
          path: yarn.lock
